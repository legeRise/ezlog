name: Release

# Tag a commit (e.g. `git tag v2.0.0 && git push origin v2.0.0`) and this builds
# the Linux x64 bundle, checks it against version.py, and attaches it to a
# GitHub Release under the stable asset name that `ezlog upgrade` downloads.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Tag must match version.py
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import version; print(version.__version__)')"
          TAG="${GITHUB_REF_NAME#v}"
          echo "version.py=$VERSION tag=$TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($VERSION)."
            echo "Bump version.py or retag." >&2
            exit 1
          fi

      - name: Build standalone binary
        run: pyinstaller ezlog.spec

      - name: Smoke test the binary
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          printf '2026-01-01 10:00:00 INFO  smoke started\n' > "$HOME/smoke.log"
          ./dist/ezlog/ezlog version
          ./dist/ezlog/ezlog add smoke "$HOME/smoke.log"
          ./dist/ezlog/ezlog list

      - name: Package release asset
        run: |
          set -euo pipefail
          rm -rf pkg && mkdir -p pkg
          cp -r dist/ezlog pkg/ezlog-linux-x64
          cp install.sh README.md pkg/ezlog-linux-x64/
          tar -C pkg -czf ezlog-linux-x64.tar.gz ezlog-linux-x64
          sha256sum ezlog-linux-x64.tar.gz | tee SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ezlog-linux-x64.tar.gz
            SHA256SUMS
          generate_release_notes: true
