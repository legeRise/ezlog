<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZLog</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- Apply the saved theme before first paint so there is no flash -->
    <script>
        (function () {
            try {
                document.documentElement.className = localStorage.getItem('ezlog-theme') || 'dark';
            } catch (e) { /* localStorage unavailable */ }
        })();
    </script>
    <!-- Local, prebuilt Tailwind (offline; no CDN) -->
    <link rel="stylesheet" href="/static/tailwind.css">
    <style>
        /* Mobile: Hide scrollbars for cleaner look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Desktop: Custom scrollbar */
        @media (min-width: 768px) {
            ::-webkit-scrollbar { width: 12px; height: 12px; }
            ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
            ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 6px; border: 3px solid var(--scrollbar-track); }
            ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
        }

        /* Theme-specific scrollbar colors */
        .dark { --scrollbar-track: #1e1e1e; --scrollbar-thumb: #424242; --scrollbar-thumb-hover: #5a5a5a; }
        .light { --scrollbar-track: #f5f5f5; --scrollbar-thumb: #d0d0d0; --scrollbar-thumb-hover: #b0b0b0; }
        .solarized-light { --scrollbar-track: #fdf6e3; --scrollbar-thumb: #93a1a1; --scrollbar-thumb-hover: #657b83; }

        /* Monospace log font (system stack — no webfont needed, works offline) */
        .log-font {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 13px;
            font-variant-ligatures: none;
        }

        /* Virtualized rows use a fixed height so positions are predictable */
        .log-row { height: 22px; line-height: 22px; }
        .nowrap-row { white-space: pre; }
        .wrapped-row { white-space: pre-wrap; word-break: break-word; height: auto; line-height: 1.5; }
        .log-num { user-select: none; }

        /* Connection chip */
        .conn-chip {
            display: inline-flex; align-items: center; gap: .35rem;
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .04em; padding: .15rem .5rem; border-radius: 999px;
            white-space: nowrap;
        }
        .conn-chip .dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; }
        .conn-live { color: #22c55e; background: rgba(34,197,94,.14); }
        .conn-history { color: #60a5fa; background: rgba(96,165,250,.14); }
        .conn-connecting { color: #eab308; background: rgba(234,179,8,.14); }
        .conn-offline { color: #ef4444; background: rgba(239,68,68,.14); }

        /* Sidebar health dots + unread badges */
        .health-dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
        .health-dot.ok { background: #22c55e; }
        .health-dot.missing { background: #ef4444; }
        .health-dot.unknown { background: #6b7280; }
        .hl-badge {
            font-size: 9px; font-weight: 700; line-height: 1;
            padding: 2px 5px; border-radius: 999px; flex: none;
        }
        .hl-badge.err { background: #dc2626; color: #fff; }
        .hl-badge.warn { background: #ca8a04; color: #fff; }

        /* Insights histogram bar */
        .hist-bar { height: 6px; border-radius: 3px; }

        /* Light theme overrides */
        .light { background: #ffffff; color: #333333; }
        .light .bg-gray-900 { background: #fafafa !important; }
        .light .bg-gray-800 { background: #ffffff !important; border-color: #e5e5e5 !important; }
        .light .bg-gray-700 { background: #f5f5f5 !important; }
        .light .text-gray-300 { color: #444444 !important; }
        .light .text-gray-400 { color: #666666 !important; }
        .light .text-gray-500 { color: #999999 !important; }
        .light .border-gray-600 { border-color: #d5d5d5 !important; }
        .light .hover\:bg-gray-700:hover { background: #ebebeb !important; }
        .light .hover\:bg-gray-800:hover { background: #f8f8f8 !important; }
        .light .hover\:border-gray-700 { border-color: #e0e0e0 !important; }
        .light .text-red-400 { color: #c53030 !important; }
        .light .text-yellow-400 { color: #d97706 !important; }
        .light .text-blue-400 { color: #2563eb !important; }
        .light .text-green-400 { color: #059669 !important; }

        /* Solarized light theme */
        .solarized-light { background: #fdf6e3; color: #657b83; }
        .solarized-light .bg-gray-900 { background: #fdf6e3 !important; }
        .solarized-light .bg-gray-800 { background: #eee8d5 !important; border-color: #d3cbb7 !important; }
        .solarized-light .bg-gray-700 { background: #f5eedb !important; }
        .solarized-light .text-gray-300 { color: #586e75 !important; }
        .solarized-light .text-gray-400 { color: #657b83 !important; }
        .solarized-light .text-gray-500 { color: #93a1a1 !important; }
        .solarized-light .border-gray-600 { border-color: #d3cbb7 !important; }
        .solarized-light .hover\:bg-gray-700:hover { background: #e8e1ce !important; }
        .solarized-light .hover\:bg-gray-800:hover { background: #f0e9d6 !important; }
        .solarized-light .hover\:border-gray-700 { border-color: #cdc4af !important; }
        .solarized-light .text-red-400 { color: #dc322f !important; }
        .solarized-light .text-yellow-400 { color: #b58900 !important; }
        .solarized-light .text-blue-400 { color: #268bd2 !important; }
        .solarized-light .text-green-400 { color: #859900 !important; }
    </style>
</head>
<!-- h-[100dvh] fixes scroll issues on mobile browsers with address bars -->
<body class="bg-gray-900 text-gray-300 h-[100dvh] flex overflow-hidden relative">

    <!-- MOBILE OVERLAY -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-gray-800 border-r border-gray-600 transform -translate-x-full transition-transform duration-300 ease-in-out z-50 md:relative md:translate-x-0 flex flex-col shadow-2xl md:shadow-none">
        <div class="h-14 p-4 border-b border-gray-600 font-bold tracking-wider text-white flex justify-between items-center">
            <span>EZLOG</span>
            <span class="text-xs font-normal text-gray-500">v{{ version }}</span>
            <button id="closeSidebar" class="md:hidden text-gray-400 hover:text-white">✕</button>
        </div>

        <div class="p-2 border-b border-gray-600">
            <input type="text" id="projectSearch" placeholder="Filter logs..."
                class="w-full bg-gray-700 text-white text-sm rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500 placeholder-gray-500">
        </div>

        <div id="projectList" class="flex-1 overflow-y-auto">
            <!-- Injected by JS -->
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col min-w-0 h-full">

        <!-- COMMAND BAR -->
        <header class="h-14 shrink-0 bg-gray-800 border-b border-gray-600 flex items-center gap-2 px-2 md:px-4 z-30">
            <button id="toggleSidebar" class="md:hidden text-gray-400 hover:text-white p-1 border border-gray-600 rounded" title="Menu">☰</button>

            <div class="flex flex-col overflow-hidden flex-1 min-w-0">
                <div class="flex items-center gap-2 min-w-0">
                    <h2 id="currentLogTitle" class="font-semibold text-white truncate text-sm md:text-base">Select a log</h2>
                    <span id="connChip" class="conn-chip conn-offline hidden">
                        <span class="dot"></span><span id="connLabel"></span>
                    </span>
                </div>
                <span id="fileInfo" class="text-[11px] text-blue-400 font-medium truncate"></span>
            </div>

            <div class="flex items-center gap-1 md:gap-2">
                <!-- Level filter chips -->
                <div id="levelChips" class="hidden sm:flex items-center rounded border border-gray-600 overflow-hidden text-[11px] leading-none">
                    <button data-level="ALL" class="lvl px-2 py-1.5 text-gray-400 hover:bg-gray-700">ALL</button>
                    <button data-level="ERROR" class="lvl px-2 py-1.5 text-gray-400 hover:bg-gray-700 border-l border-gray-600">ERR</button>
                    <button data-level="WARN" class="lvl px-2 py-1.5 text-gray-400 hover:bg-gray-700 border-l border-gray-600">WARN</button>
                    <button data-level="INFO" class="lvl px-2 py-1.5 text-gray-400 hover:bg-gray-700 border-l border-gray-600">INFO</button>
                </div>

                <input type="text" id="logFilter" placeholder="Filter · Enter = search file"
                    class="bg-gray-900 border border-gray-600 text-sm rounded-md px-2 py-1.5 w-24 focus:w-44 md:w-44 transition-all focus:outline-none focus:border-blue-500">

                <button id="lineNumBtn" class="hidden md:inline text-gray-400 hover:text-white text-sm px-2 py-1 border border-gray-600 rounded" title="Toggle line numbers (L)">#</button>
                <button id="wrapBtn" class="hidden md:inline text-gray-400 hover:text-white text-sm px-2 py-1 border border-gray-600 rounded" title="Toggle line wrapping (W)">↵</button>

                <button id="pauseBtn" class="flex items-center space-x-1 px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-sm transition-colors border border-gray-600" title="Pause / resume live updates (p)">
                    <span id="pauseIcon">⏸</span>
                    <span id="pendingCount" class="bg-blue-500 text-white text-[10px] px-1.5 rounded-full hidden">0</span>
                </button>

                <button id="goTopBtn" class="hidden text-gray-400 hover:text-white px-2 py-1 border border-gray-600 rounded text-sm hover:bg-gray-700" title="Go to top (g)">⬆</button>
                <button id="goBottomBtn" class="hidden text-gray-400 hover:text-white px-2 py-1 border border-gray-600 rounded text-sm hover:bg-gray-700" title="Go to bottom / live (G)">⬇</button>

                <button id="panelBtn" class="text-gray-400 hover:text-white text-sm px-2 py-1 border border-gray-600 rounded" title="Insights panel">📊</button>
                <button id="notifyBtn" class="hidden md:inline text-gray-500 hover:text-white text-lg px-1.5" title="Toggle desktop notifications for new errors">🔕</button>
                <button id="themeBtn" class="text-gray-400 hover:text-white text-lg px-1.5" title="Switch theme">🎨</button>
                <button id="downloadBtn" class="hidden md:inline text-gray-400 hover:text-white text-sm px-1.5" title="Download log">⬇️</button>
                <button id="clearBtn" class="hidden md:inline text-gray-400 hover:text-red-400 text-sm px-1.5" title="Clear view">🚫</button>
            </div>
        </header>

        <!-- OPEN TABS -->
        <div id="tabBar" class="hidden h-8 shrink-0 bg-gray-800 border-b border-gray-600 items-center overflow-x-auto no-scrollbar text-xs"></div>

        <!-- VIEWER + INSIGHTS -->
        <div class="flex-1 flex min-h-0">
        <div id="viewer" class="flex-1 relative overflow-hidden log-font">
            <!-- Virtualized scroller -->
            <div id="scroll" class="absolute inset-0 overflow-auto md:pb-0">
                <div id="sizer" class="relative w-full">
                    <div id="rows" class="absolute top-0 left-0 w-full"></div>
                </div>
            </div>

            <!-- Overlays live OUTSIDE the scroller so clearing rows never removes them -->
            <div id="welcome" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 text-center pointer-events-none">
                <p class="text-lg">📋 Select a log file</p>
                <p class="text-sm mt-2 opacity-70">Use the sidebar to start streaming</p>
            </div>

            <div id="topLoader" class="hidden absolute top-2 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-xs px-3 py-1 rounded-full shadow-lg z-20">
                Loading older logs…
            </div>

            <div id="loadingIndicator" class="hidden absolute top-3 right-3 bg-blue-600 text-white text-xs px-3 py-1 rounded-full shadow-lg z-20">
                Loading…
            </div>

            <div id="toast" class="hidden absolute bottom-4 left-4 bg-gray-800 border border-gray-600 text-gray-200 text-xs px-3 py-1.5 rounded-full shadow-lg z-20 max-w-[70%] truncate"></div>

            <div id="selBar" class="hidden absolute bottom-4 right-4 bg-gray-800 border border-gray-600 rounded-lg shadow-lg z-20 flex items-center gap-2 px-3 py-1.5 text-xs">
                <span id="selCount" class="text-gray-300 font-medium"></span>
                <button id="selCopy" class="px-2 py-0.5 bg-gray-700 hover:bg-gray-600 rounded transition-colors" title="Copy selected lines (c)">Copy</button>
                <button id="selDownload" class="px-2 py-0.5 bg-blue-600 hover:bg-blue-500 text-white rounded transition-colors" title="Download selected lines">Download</button>
                <button id="selClear" class="px-1 text-gray-400 hover:text-white" title="Clear selection (Esc)">✕</button>
            </div>

            <button id="jumpLatest" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-1.5 rounded-full shadow-lg z-20">
                ↓ Jump to latest
            </button>
        </div>

        <!-- INSIGHTS PANEL -->
        <aside id="insights" class="hidden w-72 shrink-0 bg-gray-800 border-l border-gray-600 overflow-y-auto"></aside>
        </div>
    </main>

    <!-- Inject Aliases, Groups and Script -->
    <script>const ALIASES = {{ aliases_json|safe }};</script>
    <script>const GROUPS = {{ groups_json|safe }};</script>
    <script>const INITIAL_ALIAS = {{ initial_alias|tojson }};</script>
    <script src="/static/app.js"></script>
</body>
</html>
